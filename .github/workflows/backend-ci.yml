name: Backend CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: trainhack
          POSTGRES_PASSWORD: trainhack
          POSTGRES_DB: trainhack
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U trainhack -d trainhack"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci
      - run: npx prisma generate
        env:
          DATABASE_URL: postgresql://trainhack:trainhack@localhost:5432/trainhack?schema=public
      - run: npm run build
      - run: npm test
        env:
          NODE_ENV: test
          DATABASE_URL: postgresql://trainhack:trainhack@localhost:5432/trainhack?schema=public
          REDIS_URL: redis://localhost:6379
          JWT_ACCESS_SECRET: ci-access-secret-that-is-long-enough
          JWT_REFRESH_SECRET: ci-refresh-secret-that-is-long-enough
