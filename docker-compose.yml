services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: trainhack
      POSTGRES_PASSWORD: trainhack
      POSTGRES_DB: trainhack
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U trainhack -d trainhack"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis_data:/data

  backend:
    build:
      context: ./backend
    env_file:
      - ./backend/.env
    environment:
      DATABASE_URL: postgresql://trainhack:trainhack@postgres:5432/trainhack?schema=public
      REDIS_URL: redis://redis:6379
      LAB_ORCHESTRATOR: docker
      LAB_PUBLIC_HOST: localhost
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
    ports:
      - "4000:4000"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock

  nginx:
    image: nginx:1.27-alpine
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    ports:
      - "8080:80"
    depends_on:
      - backend

  lab-web-image:
    image: trainhack/lab-web:local
    build:
      context: ./backend/lab-images/web
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost/status | grep -q online"]
      interval: 10s
      timeout: 5s
      retries: 3
    profiles:
      - lab-images

volumes:
  postgres_data:
  redis_data:
